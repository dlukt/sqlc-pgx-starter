version: "2"

sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "internal/migrations/sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_exact_table_names: false
        overrides:
          # Map PostgreSQL `uuid` columns to github.com/google/uuid.UUID.
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
